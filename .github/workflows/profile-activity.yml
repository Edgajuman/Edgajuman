name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public activity cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py
      - name: Save updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public profile metadata"
            git push
          fi
